name: Verify generators

# DORMANT, deliberately. This account is locked for billing, so since
# 2026-08-14 every run fails before its first step with "The job was not started
# because your account is locked due to a billing issue". The checks themselves
# live in scripts/verify.mjs now: run them with `npm run verify`, and the daily
# Railway job (scripts/cron/run.mjs) runs the same file against a fresh clone
# every morning.
#
# It is kept on workflow_dispatch rather than deleted so it is one click away if
# the billing lock is ever lifted. Do not restore the push trigger while the
# Railway job is running: its path filter matched scripts/**, which the daily
# scripts/stats-data.json commit touches, so it would fail on every rotation.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Generators exit 0, regenerating changes nothing, no em or en dashes.
      - name: Verify
        run: npm run verify
