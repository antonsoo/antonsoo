name: Tabula refresh

# Refreshes the bespoke ledger card (assets/stats.svg) from live GitHub data.
# Self-rendered in this repo, so the profile never depends on a third-party
# stats service that might rate-limit or 503.

on:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tabula
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PROFILE_USER: antonsoo

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: npm ci

      - name: Refresh ledger data from the GitHub API
        run: |
          set -euo pipefail
          followers=$(gh api "users/${PROFILE_USER}" --jq '.followers')
          created=$(gh api "users/${PROFILE_USER}" --jq '.created_at' | cut -c1-4)
          repos=$(gh api "users/${PROFILE_USER}/repos" --paginate -X GET -f per_page=100 -f type=owner \
            | jq -rs 'add | map(select(.private==false and .fork==false)) | length')
          echo "followers=$followers created=$created repos=$repos"
          tmp=$(mktemp)
          jq --argjson c "$created" --argjson r "$repos" --argjson f "$followers" \
            '.createdYear=$c | .publicRepos=$r | .followers=$f' scripts/stats-data.json > "$tmp"
          mv "$tmp" scripts/stats-data.json

      - name: Render and commit if changed
        run: |
          set -euo pipefail
          node scripts/gen-stats.mjs
          if git diff --quiet -- assets/stats.svg scripts/stats-data.json; then
            echo "no change"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg scripts/stats-data.json
          git commit -m "chore(tabula): refresh public ledger [skip ci]"
          git push
