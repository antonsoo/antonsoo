name: Contribution snake

# Generates the contribution-graph snake in PRAVIEL's palette and publishes it
# to the `output` branch, where the README references it by raw URL.

on:
  schedule:
    - cron: "41 3 * * *" # 03:41 UTC daily
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # Two outputs, one per GitHub theme; the README picks via <picture>.
      # Light: crimson snake, toasted-parchment empty cells (visible on white).
      # Dark: pale-gold snake, umber-to-gold ramp (brightest = most commits).
      - name: Generate snake (light and dark, PRAVIEL palette)
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%238B1E1E&color_dots=%23EDE4D3,%23E6CF94,%23C5A059,%23A24E30,%238B1E1E
            dist/snake-dark.svg?palette=github-dark&color_snake=%23E6CF94&color_dots=%23262220,%234A3A22,%237A5C2E,%23A8853F,%23C5A059

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
