name: Contribution snake

# Generates the contribution-graph snake in PRAVIEL's palette and publishes it
# to the `output` branch, where the README references it by raw URL.

on:
  schedule:
    - cron: "41 3 * * *" # 03:41 UTC daily
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake (crimson snake, parchment-to-crimson dots)
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=%238B1E1E&color_dots=%23F3EFE7,%23E6CF94,%23C5A059,%23A24E30,%238B1E1E

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
